<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TI2 - Front End | Cadastro de Escolas</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="escolas.css" />
  </head>
  <body>
    <header>
      <div class="banner">
        <img src="../../assets/images/banner_ti.png" alt="" />
      </div>
      <div class="barra-info">
        <nav class="menu">
          <ul>
            <li><a href="../../index.html">Home</a></li>
            <li><a href="../../about.html">Sobre nós</a></li>
            <li><a href="index.html">Cadastro de Escolas</a></li>
          </ul>
        </nav>
        <div class="dados-usuario">
          <a href="../../home.html">Minha conta</a>
        </div>
      </div>
    </header>

    <main class="area-escolas">
      <h2 class="titulo-escolas">Cadastro Escola</h2>

      <!-- formulario -->
      <form id="form-escola" class="cartao-escola" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control" placeholder="Ex: Escola Estadual Tiradentes" required />
          </div>
          <div class="col-md-6">
            <label for="cnpj" class="form-label">CNPJ</label>
            <input type="text" id="cnpj" class="form-control" placeholder="Ex: 12.345.678/0001-90" required />
          </div>

          <div class="col-12 subtitulo">Endereço</div>
          <div class="col-md-10">
            <label for="rua" class="form-label">Rua</label>
            <input type="text" id="rua" class="form-control" required />
          </div>
          <div class="col-md-2">
            <label for="numero" class="form-label">Nº</label>
            <input type="text" id="numero" class="form-control" required />
          </div>

          <div class="col-md-3">
            <label for="cep" class="form-label">CEP</label>
            <input type="text" id="cep" class="form-control" placeholder="Ex: 30130-000" required />
          </div>
          <div class="col-md-3">
            <label for="bairro" class="form-label">Bairro</label>
            <input type="text" id="bairro" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label for="cidade" class="form-label">Cidade</label>
            <input type="text" id="cidade" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label for="estado" class="form-label">Estado</label>
            <input type="text" id="estado" class="form-control" placeholder="Ex: MG" maxlength="2" required />
          </div>

          <div class="col-md-6">
            <label for="codigo_inep" class="form-label">Código INEP</label>
            <input type="text" id="codigo_inep" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="dependencia" class="form-label">Dependência administrativa</label>
            <select id="dependencia" class="form-select" required>
              <option value="">Selecione...</option>
              <option>Federal</option>
              <option>Estadual</option>
              <option>Municipal</option>
              <option>Privada</option>
            </select>
          </div>
        </div>

        <!-- botoes -->
        <div class="botoes-escola">
          <button type="button" id="btn-inserir" class="btn btn-escola">Inserir</button>
          <button type="button" id="btn-excluir" class="btn btn-escola" disabled>Excluir</button>
          <button type="button" id="btn-alterar" class="btn btn-escola" disabled>Alterar</button>
        </div>
      </form>

      <!-- tabela com as escolas -->
      <div class="cartao-escola mt-4">
        <h5 class="text-white">Escolas cadastradas</h5>
        <p class="dica">Clique numa escola para Alterar ou Excluir. Clique de novo para desmarcar.</p>
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>Nome</th>
                <th>CNPJ</th>
                <th>Cidade/UF</th>
                <th>Código INEP</th>
                <th>Dependência</th>
              </tr>
            </thead>
            <tbody id="tabela-escolas"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="escolas.js"></script>
  </body>
</html>
