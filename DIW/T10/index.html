<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trilha Verde | Parques Nacionais do Brasil</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS do projeto -->
    <link href="assets/css/styles.css" rel="stylesheet">
</head>

<body data-pagina="home">

    <!-- Cabeçalho -->
    <header id="cabecalho"></header>

    <main>

        <!-- Parques em destaque -->
        <section
            id="destaques"
            aria-label="Parques em destaque"
        >
            <div id="carrossel"></div>
        </section>

        <!-- Todos os parques -->
        <section
            id="parques"
            class="secao"
        >
            <div class="container">

                <h2 class="secao-titulo">
                    Todos os parques
                </h2>

                <div
                    id="cards"
                    class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"
                ></div>

            </div>
        </section>

        <!-- Informações do aluno -->
        <section class="secao pt-0">
            <div class="container">

                <h2 class="secao-titulo">
                    Informações do(a) aluno(a)
                </h2>

                <div id="autoria"></div>

            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <div class="container">
            Trilha Verde &middot; Trabalho Prático 1
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- JavaScript do projeto -->
    <script src="assets/js/app.js"></script>

</body>

</html>
