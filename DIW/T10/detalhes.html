<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes | Trilha Verde</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS do projeto -->
    <link href="assets/css/styles.css" rel="stylesheet">
</head>

<body data-pagina="detalhes">

    <!-- Cabeçalho -->
    <header id="cabecalho"></header>

    <main class="container secao">

        <!-- Informações gerais -->
        <h2 class="secao-titulo">
            Informações gerais
        </h2>

        <section id="detalhes"></section>

        <!-- Galeria de fotos -->
        <section
            id="secao-fotos"
            class="mt-5"
        >

            <h2 class="secao-titulo">
                Fotos do parque
            </h2>

            <div class="galeria-wrap">

                <!-- Botão anterior -->
                <button
                    id="galeria-anterior"
                    class="galeria-btn"
                    aria-label="Fotos anteriores"
                >
                    <i class="bi bi-chevron-left"></i>
                </button>

                <!-- Galeria -->
                <div
                    id="galeria"
                    class="galeria"
                ></div>

                <!-- Botão próximo -->
                <button
                    id="galeria-proximo"
                    class="galeria-btn"
                    aria-label="Próximas fotos"
                >
                    <i class="bi bi-chevron-right"></i>
                </button>

            </div>

        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <div class="container">

            <a
                href="index.html"
                class="text-white"
            >
                Voltar para o início
            </a>

        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- JavaScript do projeto -->
    <script src="assets/js/app.js"></script>

</body>

</html>
